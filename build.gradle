// NutriPulse build.gradle
// DEĞIŞIKLIK: OR-Tools native bağımlılığı + gRPC + protobuf kaldırıldı.
// Tüm optimizasyon NutriPulseHiGHS (pure Kotlin) üzerinde çalışır.

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.nutripulse.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.nutripulse.app"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
    }
}

dependencies {
    // ── Kotlin & AndroidX ────────────────────────────────────────────
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.0"
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ── Lifecycle & Coroutines ────────────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // ── Room Database ─────────────────────────────────────────────────
    implementation 'androidx.room:room-runtime:2.4.3'
    implementation 'androidx.room:room-ktx:2.4.3'
    kapt 'androidx.room:room-compiler:2.4.3'

    // ── Network (Fiyat scraping) ──────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.jsoup:jsoup:1.15.3'

    // ── Grafik ───────────────────────────────────────────────────────
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ── Test ─────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'

    // ── KALDIRILDI ────────────────────────────────────────────────────
    // Google OR-Tools → Android'de UnsatisfiedLinkError (native .so yok)
    // implementation('com.google.ortools:ortools-java:9.9.3963')

    // gRPC + protobuf → OR-Tools ile birlikte geliyordu, artık gerek yok
    // implementation 'io.grpc:grpc-okhttp:1.57.2'
    // implementation 'io.grpc:grpc-protobuf-lite:1.57.2'
    // implementation 'io.grpc:grpc-stub:1.57.2'
    // implementation 'javax.annotation:javax.annotation-api:1.3.2'
    // implementation 'com.google.protobuf:protobuf-javalite:3.24.4'
}

// ── KALDIRILDI ────────────────────────────────────────────────────────────
// protobuf { ... } bloğu OR-Tools ile birlikte geliyordu, artık gerek yok.
// Eğer başka bir amaçla protobuf kullanıyorsanız tekrar ekleyebilirsiniz.
